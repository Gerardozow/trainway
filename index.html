<!doctype html>
<html lang="es" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Trainway — tu plan de gimnasio, generado y ajustado semana a semana." />
    <meta name="theme-color" content="#FFC603" />
    <title>Trainway</title>
    <link rel="icon" type="image/svg+xml" href="/trainway/icons/icon.svg" />
    <link rel="apple-touch-icon" href="/trainway/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <script>
      // Aplica el tema antes del primer pintado para evitar el destello de tema claro.
      try {
        const stored = localStorage.getItem('trainway-theme') || 'system'
        const dark =
          stored === 'dark' ||
          (stored === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.toggle('dark', dark)
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
